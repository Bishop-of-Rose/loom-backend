[project]
name = "loom-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "authlib>=1.9.1",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.162.0",
    "httpx2>=2.16.0",
    "itsdangerous>=2.2.0",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.6",
]

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning"
]

