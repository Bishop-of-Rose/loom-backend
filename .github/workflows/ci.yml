name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: test_database
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_database
          REDIS_URL: redis://localhost:6379/0
          ACCESS_JWT_SECRET: e46cd73af5e53e701501b27ca24132ccf16aea3baa4fdfb25132cd19570819c3
          REFRESH_JWT_SECRET: d46e9a019cb7139c94212e35256bebeb6c0cfb9c5aa42268a0d6bded80b61df9
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 15
          REFRESH_TOKEN_EXPIRE_DAYS: 7
          SESSION_SECRET: ab3a01fa5c8752e11ff823fd187db6f0b7f4c8dd917fbfc64a9bfd4c3bc7fb60
        run: |
          pytest
